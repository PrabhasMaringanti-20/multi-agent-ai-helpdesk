[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helpdesk-backend"
version = "1.0.0"
description = "Enterprise Multi-Agent AI Helpdesk Platform - FastAPI + LangGraph backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Helpdesk Platform Team" }]

dependencies = [
    # ---- Web framework ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    # ---- Config / validation ----
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # ---- Database ----
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # ---- Cache / broker ----
    "redis>=5.0",
    "celery[redis]>=5.4",
    # ---- Security ----
    "PyJWT>=2.8",
    "passlib[argon2]>=1.7.4",
    "bcrypt>=4.1",
    # ---- AI / RAG ----
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=1.0",
    "google-generativeai>=0.7",
    "chromadb>=0.5",
    # ---- Document ingestion (PDF / DOCX) ----
    "pypdf>=4.2",
    "python-docx>=1.1",
    # ---- HTTP / resilience ----
    "httpx>=0.27",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-passlib>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = [
    "B008",  # FastAPI Depends() in a default argument is idiomatic
    "E501",  # line length is owned by `ruff format`
    "UP046",  # keep Generic[...] rather than PEP 695 syntax (wider tooling support)
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Generated article dataset: long prose lines are the content itself.
"scripts/demo_kb_data.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
