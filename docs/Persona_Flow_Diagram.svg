<svg xmlns="http://www.w3.org/2000/svg" width="1930" height="1186" viewBox="0 0 1930 1186" font-family="Segoe UI,Calibri,Arial"><rect x="0" y="0" width="1930" height="1186" fill="#FFFFFF"/><defs><marker id="aC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9 z" fill="#235A97"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9 z" fill="#6B7A90"/></marker></defs><text x="46" y="24" font-size="19" font-weight="700" fill="#0A2E6E" font-family="Segoe UI,Calibri,Arial">Enterprise AI Helpdesk — Who does what (people’s view)</text><text x="46" y="44" font-size="12.5" fill="#6B7280" font-family="Segoe UI,Calibri,Arial">Solid arrow = does something · dashed = gets a reply. The three tiers: L1 the assistant answers · L2 it digs deeper · L3 it hands off to a person.</text><line x1="165" y1="118" x2="165" y2="1038" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><line x1="565" y1="118" x2="565" y2="1038" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><line x1="965" y1="118" x2="965" y2="1038" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><line x1="1365" y1="118" x2="1365" y2="1038" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><line x1="1765" y1="118" x2="1765" y2="1038" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><rect x="46" y="142" width="1838" height="70" rx="9" fill="#EEF1F6" fill-opacity="0.34" stroke="#5B6B86" stroke-width="1.3"/><path d="M46 142 h101 v20 h-85 l-16 -20 z" fill="#5B6B86"/><text x="57" y="156" font-size="13.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">1 · Sign in</text><rect x="46" y="218" width="1838" height="320" rx="9" fill="#EAF3FB" fill-opacity="0.34" stroke="#2E6FB0" stroke-width="1.3"/><path d="M46 218 h238 v20 h-222 l-16 -20 z" fill="#2E6FB0"/><text x="57" y="232" font-size="13.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">2 · Ask for help  (every day)</text><rect x="46" y="544" width="1838" height="236" rx="9" fill="#FBF2E3" fill-opacity="0.34" stroke="#C2701C" stroke-width="1.3"/><path d="M46 544 h200 v20 h-184 l-16 -20 z" fill="#C2701C"/><text x="57" y="558" font-size="13.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">3 · A person resolves it</text><rect x="46" y="786" width="1838" height="146" rx="9" fill="#E9F5EC" fill-opacity="0.34" stroke="#2E7D57" stroke-width="1.3"/><path d="M46 786 h238 v20 h-222 l-16 -20 z" fill="#2E7D57"/><text x="57" y="800" font-size="13.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">4 · More things people can do</text><rect x="46" y="938" width="1838" height="70" rx="9" fill="#FBEDF1" fill-opacity="0.34" stroke="#9B1B4B" stroke-width="1.3"/><path d="M46 938 h177 v20 h-161 l-16 -20 z" fill="#9B1B4B"/><text x="57" y="952" font-size="13.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">5 · Trust &amp; oversight</text><rect x="66" y="276" width="1798" height="206" rx="9" fill="#F1ECF9" fill-opacity="0.5" stroke="#7A5AAF" stroke-width="1.3"/><path d="M66 276 h192 v20 h-176 l-16 -20 z" fill="#7A5AAF"/><text x="77" y="290" font-size="13.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">what the assistant does</text><line x1="66" y1="302" x2="1864" y2="302" stroke="#7A5AAF" stroke-width="1" stroke-dasharray="5 4"/><text x="79" y="296" font-size="12.5" font-weight="700" fill="#7A5AAF" font-family="Segoe UI,Calibri,Arial">it already knows — most questions</text><line x1="66" y1="360" x2="1864" y2="360" stroke="#7A5AAF" stroke-width="1" stroke-dasharray="5 4"/><text x="79" y="354" font-size="12.5" font-weight="700" fill="#7A5AAF" font-family="Segoe UI,Calibri,Arial">unsure — it looks wider</text><line x1="66" y1="418" x2="1864" y2="418" stroke="#7A5AAF" stroke-width="1" stroke-dasharray="5 4"/><text x="79" y="412" font-size="12.5" font-weight="700" fill="#7A5AAF" font-family="Segoe UI,Calibri,Arial">can&#x27;t solve it — a person is needed</text><rect x="125" y="157" width="480" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="365" y="172" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(1)  Signs in securely — their role decides what they can see</text><line x1="165" y1="178" x2="565" y2="178" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="140" y="233" width="449" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="365" y="248" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(2)  Asks a question in plain English (can attach a file)</text><line x1="165" y1="254" x2="565" y2="254" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="159" y="311" width="411" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="365" y="326" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(3)  Instant answer, with the sources it used   (L1)</text><line x1="565" y1="332" x2="165" y2="332" stroke="#6B7A90" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aR)"/><rect x="110" y="369" width="510" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="365" y="384" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(4)  Searches every article + uploaded files, then answers   (L2)</text><line x1="565" y1="390" x2="165" y2="390" stroke="#6B7A90" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aR)"/><rect x="567" y="427" width="396" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="765" y="442" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(5)  Creates a support ticket and hands off   (L3)</text><line x1="565" y1="448" x2="965" y2="448" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="186" y="483" width="358" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="365" y="498" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(6)  Rates the answer (helpful / not helpful)</text><line x1="165" y1="504" x2="565" y2="504" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="310" y="559" width="510" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="565" y="574" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(7)  Reviews the ticket, fixes the issue, replies to the employee</text><line x1="965" y1="580" x2="165" y2="580" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="643" y="597" width="244" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="765" y="612" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(8)  Marks the ticket resolved</text><line x1="965" y1="618" x2="565" y2="618" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="794" y="635" width="343" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="965" y="650" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(9)  Drafts a new help article from the fix</text><line x1="565" y1="656" x2="1365" y2="656" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="786" y="673" width="358" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="965" y="688" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(10)  Reviews, edits and approves the article</text><line x1="1365" y1="694" x2="565" y2="694" stroke="#6B7A90" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aR)"/><rect x="75" y="728" width="580" height="30" rx="5" fill="#FFF7E6" stroke="#E0C070"/><text x="365" y="747" text-anchor="middle" font-size="14" font-style="italic" fill="#7A5410" font-family="Segoe UI,Calibri,Arial">Approved  -&gt;  the assistant now answers everyone instantly next time (it learns)</text><rect x="114" y="801" width="502" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="365" y="816" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(11)  Upload documents to search  ·  ask about their own tickets</text><line x1="165" y1="822" x2="565" y2="822" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="906" y="839" width="518" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1165" y="854" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(12)  Views dashboards — volumes, trends, AI-resolved vs escalated</text><line x1="1765" y1="860" x2="565" y2="860" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="1001" y="877" width="328" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1165" y="892" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(13)  Manages users, roles and categories</text><line x1="1765" y1="898" x2="565" y2="898" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="982" y="953" width="366" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1165" y="968" text-anchor="middle" font-size="15" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(14)  Logs every action for audit &amp; compliance</text><line x1="565" y1="974" x2="1765" y2="974" stroke="#235A97" stroke-width="2" marker-end="url(#aC)"/><rect x="25" y="58" width="280" height="60" rx="9" fill="#1F4E79"/><circle cx="51" cy="88" r="13" fill="#FFFFFF" fill-opacity="0.22"/><circle cx="51" cy="83" r="5" fill="#FFFFFF"/><path d="M41 98 a10 8 0 0 1 20 0 z" fill="#FFFFFF"/><text x="173" y="84" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Employee</text><text x="173" y="103" text-anchor="middle" font-size="12" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">needs IT help</text><rect x="425" y="58" width="280" height="60" rx="9" fill="#0E6E8C"/><circle cx="451" cy="88" r="13" fill="#FFFFFF" fill-opacity="0.22"/><circle cx="451" cy="83" r="5" fill="#FFFFFF"/><path d="M441 98 a10 8 0 0 1 20 0 z" fill="#FFFFFF"/><text x="573" y="84" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">AI Helpdesk</text><text x="573" y="103" text-anchor="middle" font-size="12" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">the assistant</text><rect x="825" y="58" width="280" height="60" rx="9" fill="#C2701C"/><circle cx="851" cy="88" r="13" fill="#FFFFFF" fill-opacity="0.22"/><circle cx="851" cy="83" r="5" fill="#FFFFFF"/><path d="M841 98 a10 8 0 0 1 20 0 z" fill="#FFFFFF"/><text x="973" y="84" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Support Engineer</text><text x="973" y="103" text-anchor="middle" font-size="12" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">resolves tickets (L3)</text><rect x="1225" y="58" width="280" height="60" rx="9" fill="#2E7D57"/><circle cx="1251" cy="88" r="13" fill="#FFFFFF" fill-opacity="0.22"/><circle cx="1251" cy="83" r="5" fill="#FFFFFF"/><path d="M1241 98 a10 8 0 0 1 20 0 z" fill="#FFFFFF"/><text x="1373" y="84" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Knowledge Expert</text><text x="1373" y="103" text-anchor="middle" font-size="12" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">reviews &amp; approves</text><rect x="1625" y="58" width="280" height="60" rx="9" fill="#9B1B4B"/><circle cx="1651" cy="88" r="13" fill="#FFFFFF" fill-opacity="0.22"/><circle cx="1651" cy="83" r="5" fill="#FFFFFF"/><path d="M1641 98 a10 8 0 0 1 20 0 z" fill="#FFFFFF"/><text x="1773" y="84" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Admin</text><text x="1773" y="103" text-anchor="middle" font-size="12" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">dashboards &amp; oversight</text><line x1="46" y1="1060" x2="1884" y2="1060" stroke="#DCE4F2" stroke-width="1.5"/><text x="46" y="1087" font-size="16" font-weight="700" fill="#0A2E6E" font-family="Segoe UI,Calibri,Arial">Built with — the technology used</text><rect x="46" y="1102" width="352" height="64" rx="10" fill="#2E7D57"/><text x="222" y="1130" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">React</text><text x="222" y="1149" text-anchor="middle" font-size="11.5" fill="#EAF0F8" font-family="Segoe UI,Calibri,Arial">the web app people use</text><rect x="418" y="1102" width="352" height="64" rx="10" fill="#6B3FA0"/><text x="593" y="1130" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">FastAPI</text><text x="593" y="1149" text-anchor="middle" font-size="11.5" fill="#EAF0F8" font-family="Segoe UI,Calibri,Arial">the backend service</text><rect x="789" y="1102" width="352" height="64" rx="10" fill="#C2701C"/><text x="965" y="1130" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">AI Engine · LangGraph</text><text x="965" y="1149" text-anchor="middle" font-size="11.5" fill="#EAF0F8" font-family="Segoe UI,Calibri,Arial">runs the AI steps</text><rect x="1161" y="1102" width="352" height="64" rx="10" fill="#0E6E8C"/><text x="1337" y="1130" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">LLM</text><text x="1337" y="1149" text-anchor="middle" font-size="11.5" fill="#EAF0F8" font-family="Segoe UI,Calibri,Arial">language model + embeddings</text><rect x="1532" y="1102" width="352" height="64" rx="10" fill="#9B1B4B"/><text x="1708" y="1130" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">PostgreSQL</text><text x="1708" y="1149" text-anchor="middle" font-size="11.5" fill="#EAF0F8" font-family="Segoe UI,Calibri,Arial">stores data + powers search</text></svg>