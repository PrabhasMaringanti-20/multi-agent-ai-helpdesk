<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1430" viewBox="0 0 1820 1430" font-family="Segoe UI,Calibri,Arial"><rect x="0" y="0" width="1820" height="1430" fill="#FFFFFF"/><defs><marker id="aC" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9 z" fill="#235A97"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9 z" fill="#6B7A90"/></marker><marker id="aS" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9 z" fill="#B26A12"/></marker></defs><text x="44" y="22" font-size="18" font-weight="700" fill="#0A2E6E" font-family="Segoe UI,Calibri,Arial">Enterprise AI Helpdesk — Full Platform Flow (one diagram, five phases)</text><text x="44" y="42" font-size="12" fill="#6B7280" font-family="Segoe UI,Calibri,Arial">Solid arrow = request · dashed = response · italic = the AI’s internal step. The user acts through the React web app; the model is shown as LLM.</text><line x1="150" y1="112" x2="150" y2="1418" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><line x1="530" y1="112" x2="530" y2="1418" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><line x1="910" y1="112" x2="910" y2="1418" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><line x1="1290" y1="112" x2="1290" y2="1418" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><line x1="1670" y1="112" x2="1670" y2="1418" stroke="#B9C2D6" stroke-width="1.1" stroke-dasharray="3 4"/><rect x="44" y="134" width="1732" height="124" rx="8" fill="#EEF1F6" fill-opacity="0.36" stroke="#5B6B86" stroke-width="1.2"/><path d="M44 134 h310 v18 h-296 l-14 -18 z" fill="#5B6B86"/><text x="54" y="147" font-size="12.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Phase 1 · Sign in  (Authentication + RBAC)</text><rect x="44" y="264" width="1732" height="552" rx="8" fill="#EAF3FB" fill-opacity="0.36" stroke="#2E6FB0" stroke-width="1.2"/><path d="M44 264 h415 v18 h-401 l-14 -18 z" fill="#2E6FB0"/><text x="54" y="277" font-size="12.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Phase 2 · Ask the AI  (chat · retrieval · L1/L2/L3 tiers)</text><rect x="44" y="822" width="1732" height="156" rx="8" fill="#F1ECF9" fill-opacity="0.36" stroke="#6B3FA0" stroke-width="1.2"/><path d="M44 822 h422 v18 h-408 l-14 -18 z" fill="#6B3FA0"/><text x="54" y="835" font-size="12.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Phase 3 · Ask the database in plain English  (AI Data API)</text><rect x="44" y="984" width="1732" height="232" rx="8" fill="#E9F5EC" fill-opacity="0.36" stroke="#2E7D57" stroke-width="1.2"/><path d="M44 984 h394 v18 h-380 l-14 -18 z" fill="#2E7D57"/><text x="54" y="997" font-size="12.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Phase 4 · Search uploaded documents  (Document Search)</text><rect x="44" y="1222" width="1732" height="168" rx="8" fill="#FBF2E3" fill-opacity="0.36" stroke="#C2701C" stroke-width="1.2"/><path d="M44 1222 h345 v18 h-331 l-14 -18 z" fill="#C2701C"/><text x="54" y="1235" font-size="12.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">Phase 5 · The learning loop  (self-improvement)</text><rect x="62" y="558" width="1696" height="178" rx="8" fill="#F1ECF9" fill-opacity="0.45" stroke="#7A5AAF" stroke-width="1.2"/><path d="M62 558 h93 v18 h-79 l-14 -18 z" fill="#7A5AAF"/><text x="72" y="571" font-size="12.5" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">which tier?</text><line x1="62" y1="581" x2="1758" y2="581" stroke="#7A5AAF" stroke-width="1" stroke-dasharray="5 4"/><text x="74" y="576" font-size="11.5" font-weight="700" fill="#7A5AAF" font-family="Segoe UI,Calibri,Arial">[L1] confident</text><line x1="62" y1="631" x2="1758" y2="631" stroke="#7A5AAF" stroke-width="1" stroke-dasharray="5 4"/><text x="74" y="626" font-size="11.5" font-weight="700" fill="#7A5AAF" font-family="Segoe UI,Calibri,Arial">[L2] unsure</text><line x1="62" y1="681" x2="1758" y2="681" stroke="#7A5AAF" stroke-width="1" stroke-dasharray="5 4"/><text x="74" y="676" font-size="11.5" font-weight="700" fill="#7A5AAF" font-family="Segoe UI,Calibri,Arial">[L3] stuck</text><rect x="905" y="348" width="10" height="428" fill="#C2701C" fill-opacity="0.28" stroke="#C2701C" stroke-width="0.8"/><rect x="145" y="146" width="390" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="160" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(1) Sign in — POST /auth/login (org, email, password)</text><line x1="150" y1="166" x2="530" y2="166" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="955" y="178" width="291" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1100" y="192" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(2) Verify argon2 password, issue a JWT</text><line x1="530" y1="198" x2="1670" y2="198" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="163" y="210" width="355" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="224" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(3) JWT token — role is checked on every request</text><line x1="530" y1="230" x2="150" y2="230" stroke="#6B7A90" stroke-width="1.9" stroke-dasharray="6 4" marker-end="url(#aR)"/><rect x="156" y="276" width="369" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="290" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(4) Ask an IT question — POST /chat/messages (SSE)</text><line x1="150" y1="296" x2="530" y2="296" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="631" y="308" width="177" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="720" y="322" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(5) Run the agent graph</text><line x1="530" y1="328" x2="910" y2="328" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><path d="M910 360 h22 v17 h-22" fill="none" stroke="#B26A12" stroke-width="1.9" marker-end="url(#aS)"/><text x="942" y="372" font-size="13" font-style="italic" fill="#7A5410" font-family="Segoe UI,Calibri,Arial">ingress_guard — safety / injection check</text><rect x="937" y="382" width="326" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1100" y="396" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(6) Understand the question — classify (LLM)</text><line x1="910" y1="402" x2="1290" y2="402" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="1081" y="414" width="419" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1290" y="428" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(7) Retrieve — keyword + vector search (+ uploaded files)</text><line x1="910" y1="434" x2="1670" y2="434" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="951" y="446" width="298" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1100" y="460" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(8) Write a grounded, cited answer (LLM)</text><line x1="910" y1="466" x2="1290" y2="466" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="912" y="478" width="376" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1100" y="492" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(9) Verify the answer is supported by sources (LLM)</text><line x1="910" y1="498" x2="1290" y2="498" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><path d="M910 530 h22 v17 h-22" fill="none" stroke="#B26A12" stroke-width="1.9" marker-end="url(#aS)"/><text x="942" y="542" font-size="13" font-style="italic" fill="#7A5410" font-family="Segoe UI,Calibri,Arial">confidence_gate — choose the support tier</text><rect x="582" y="588" width="277" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="720" y="602" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(10) Deliver answer + citations  (L1)</text><line x1="910" y1="608" x2="530" y2="608" stroke="#6B7A90" stroke-width="1.9" stroke-dasharray="6 4" marker-end="url(#aR)"/><rect x="1066" y="638" width="447" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1290" y="652" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(11) Broad search across all KB + files, then re-answer  (L2)</text><line x1="910" y1="658" x2="1670" y2="658" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="1116" y="688" width="348" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1290" y="702" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(12) Create a ticket + notify an engineer  (L3)</text><line x1="910" y1="708" x2="1670" y2="708" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="1137" y="736" width="305" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1290" y="750" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(13) Save conversation memory + audit log</text><line x1="910" y1="756" x2="1670" y2="756" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="138" y="768" width="404" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="782" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(14) Answer + sources + L1/L2/L3 badge  (streamed live)</text><line x1="530" y1="788" x2="150" y2="788" stroke="#6B7A90" stroke-width="1.9" stroke-dasharray="6 4" marker-end="url(#aR)"/><rect x="184" y="834" width="312" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="848" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(15) Ask in plain English — POST /ai/query</text><line x1="150" y1="854" x2="530" y2="854" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="715" y="866" width="390" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="910" y="880" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(16) Plan the operation — pick ONE safe DB tool (LLM)</text><line x1="530" y1="886" x2="1290" y2="886" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="898" y="898" width="404" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1100" y="912" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(17) Run it — SELECT / INSERT / UPDATE (fixed safe set)</text><line x1="530" y1="918" x2="1670" y2="918" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="138" y="930" width="404" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="944" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(18) Explain the result in plain English (LLM) → answer</text><line x1="530" y1="950" x2="150" y2="950" stroke="#6B7A90" stroke-width="1.9" stroke-dasharray="6 4" marker-end="url(#aR)"/><rect x="198" y="996" width="284" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="1010" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(19) Upload a file (PDF / DOCX / XLSX)</text><line x1="150" y1="1016" x2="530" y2="1016" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="937" y="1028" width="326" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1100" y="1042" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(20) Parse → chunk → store (full-text index)</text><line x1="530" y1="1048" x2="1670" y2="1048" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="219" y="1060" width="241" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="1074" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(21) Search a keyword / question</text><line x1="150" y1="1080" x2="530" y2="1080" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="884" y="1092" width="433" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1100" y="1106" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(22) Full-text search over the files (LLM tailors the hits)</text><line x1="530" y1="1112" x2="1670" y2="1112" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="202" y="1124" width="277" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="1138" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(23) Results + source file &amp; location</text><line x1="530" y1="1144" x2="150" y2="1144" stroke="#6B7A90" stroke-width="1.9" stroke-dasharray="6 4" marker-end="url(#aR)"/><rect x="80" y="1172" width="1660" height="26" rx="4" fill="#FFF7E6" stroke="#E0C070"/><text x="910" y="1189" text-anchor="middle" font-size="13" font-style="italic" fill="#7A5410" font-family="Segoe UI,Calibri,Arial">Uploaded files also feed the AI Chat retriever (Phase 2)</text><rect x="116" y="1234" width="447" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="340" y="1248" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(24) Engineer resolves a ticket — POST /tickets/{id}/draft-kb</text><line x1="150" y1="1254" x2="530" y2="1254" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="729" y="1266" width="362" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="910" y="1280" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(25) Draft a KB article from the resolution (LLM)</text><line x1="530" y1="1286" x2="1290" y2="1286" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="873" y="1298" width="454" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1100" y="1312" text-anchor="middle" font-size="14" fill="#16324F" font-family="Segoe UI,Calibri,Arial">(26) Save (pending review) → after SME approval, embed &amp; index</text><line x1="530" y1="1318" x2="1670" y2="1318" stroke="#235A97" stroke-width="1.9" marker-end="url(#aC)"/><rect x="80" y="1346" width="1660" height="26" rx="4" fill="#FFF7E6" stroke="#E0C070"/><text x="910" y="1363" text-anchor="middle" font-size="13" font-style="italic" fill="#7A5410" font-family="Segoe UI,Calibri,Arial">The approved article is now searchable back in Phase 2</text><rect x="22" y="54" width="256" height="58" rx="8" fill="#1F4E79"/><text x="150" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">User</text><text x="150" y="98" text-anchor="middle" font-size="11.5" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">via React web app</text><rect x="402" y="54" width="256" height="58" rx="8" fill="#6B3FA0"/><text x="530" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">FastAPI</text><text x="530" y="98" text-anchor="middle" font-size="11.5" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">REST + SSE backend</text><rect x="782" y="54" width="256" height="58" rx="8" fill="#C2701C"/><text x="910" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">AI Engine</text><text x="910" y="98" text-anchor="middle" font-size="11.5" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">LangGraph agents</text><rect x="1162" y="54" width="256" height="58" rx="8" fill="#0E6E8C"/><text x="1290" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">LLM</text><text x="1290" y="98" text-anchor="middle" font-size="11.5" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">model + embeddings</text><rect x="1542" y="54" width="256" height="58" rx="8" fill="#9B1B4B"/><text x="1670" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Segoe UI,Calibri,Arial">PostgreSQL</text><text x="1670" y="98" text-anchor="middle" font-size="11.5" fill="#E7EEF7" font-family="Segoe UI,Calibri,Arial">database + vectors</text></svg>