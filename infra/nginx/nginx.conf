# Reverse proxy / gateway for the Helpdesk API.
# SSE streaming (the chat egress) requires disabling proxy buffering so tokens
# flush to the client immediately.

upstream helpdesk_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;   # allow KB document uploads (PDF/DOCX)

    # Streaming chat endpoint: no buffering, keep the connection alive.
    location /api/v1/chat {
        proxy_pass http://helpdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://helpdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://helpdesk_api/health;
        access_log off;
    }
}
