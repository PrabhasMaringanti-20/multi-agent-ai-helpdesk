services:
  - type: redis
    name: helpdesk-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: ai-helpdesk-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: helpdesk-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: helpdesk-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: helpdesk-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: helpdesk-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: helpdesk-db
          property: database
      - key: REDIS_URL
        fromService:
          type: redis
          name: helpdesk-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: helpdesk-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: helpdesk-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: fake
      - key: EMBEDDING_PROVIDER
        value: fake
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_ENV
        value: production

databases:
  - name: helpdesk-db
    plan: free
    region: oregon
