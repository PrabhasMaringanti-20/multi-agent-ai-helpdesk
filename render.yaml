services:
  - type: redis
    name: helpdesk-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: ai-helpdesk-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: helpdesk-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: helpdesk-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: helpdesk-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: helpdesk-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: helpdesk-db
          property: database
      - key: REDIS_URL
        fromService:
          type: redis
          name: helpdesk-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: helpdesk-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: helpdesk-redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: CORS_ORIGINS
        value: "https://multi-agent-helpdesk.vercel.app"
      - key: APP_ENV
        value: production
      - key: BOOTSTRAP_DEMO
        value: "true"
      - key: SEED_KB_DEMO
        value: "true"
      - key: BOOTSTRAP_ORG_SLUG
        value: acme
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@acme.com
      # Intentionally a plain value, not sync:false: this is a portfolio demo
      # with seeded fake data, and the password is displayed in the login UI
      # (frontend/src/modules/auth/LoginPage.tsx) so visitors can try it -
      # keep the two in sync if this ever changes.
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: "HelpdeskDemo2026!"

databases:
  - name: helpdesk-db
    plan: free
    region: oregon
